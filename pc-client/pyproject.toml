[project]
name = "sony-tv-pc-client"
version = "0.1.0"
description = "PC Client for SONY TV Remote Access System"
authors = [
    { name = "Developer" }
]
dependencies = [
    "PySide6>=6.5.0",
    "websockets>=11.0.3",
    "zeroconf>=0.119.0",  # for mDNS discovery
]
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
